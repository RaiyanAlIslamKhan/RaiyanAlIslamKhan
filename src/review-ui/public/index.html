<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipFlow — Review Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      color: #888;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }
    .video-card {
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a4a;
      transition: border-color 0.2s;
    }
    .video-card:hover { border-color: #4a4a8a; }
    .video-card video {
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 500px;
      object-fit: contain;
      background: #000;
    }
    .card-body { padding: 16px; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-topic {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pending { background: #2a2a0a; color: #ffd700; }
    .status-approved { background: #0a2a0a; color: #4caf50; }
    .status-rejected { background: #2a0a0a; color: #f44336; }
    .card-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-approve { background: #4caf50; color: #fff; }
    .btn-reject { background: #f44336; color: #fff; }
    .btn-pending { background: #ffd700; color: #000; }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }
    .empty-state h2 { font-size: 20px; margin-bottom: 8px; color: #888; }
    .error-banner {
      background: #2a0a0a;
      border: 1px solid #f44336;
      color: #f44336;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error-banner.visible { display: block; }
    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-refresh {
      background: #2a2a4a;
      color: #ccc;
      padding: 6px 14px;
      font-size: 12px;
    }
    .count { font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h1>🎬 ClipFlow Review</h1>
  <p class="subtitle">Preview and approve videos before publishing</p>

  <div class="error-banner" id="errorBanner"></div>

  <div class="refresh-bar">
    <span class="count" id="videoCount">Loading...</span>
    <button class="btn btn-refresh" onclick="loadVideos()">⟳ Refresh</button>
  </div>

  <div class="video-grid" id="videoGrid"></div>

  <div class="empty-state" id="emptyState" style="display:none">
    <h2>No videos yet</h2>
    <p>Rendered videos will appear here for review.</p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
